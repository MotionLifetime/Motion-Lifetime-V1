<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1015">
<title>Motion Lifetime</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
:root{--bg:#f4f5f8;--panel:#fff;--text:#14161c;--muted:#6a7080;--line:#dfe2ea;--accent:#4f5bf0;--accent-t:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--panel:#171a22;--text:#eef0f6;--muted:#9097a8;--line:#272b36;--accent:#7c86ff;--accent-t:#0e1015}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) calc(20px + env(safe-area-inset-bottom,0px)) env(safe-area-inset-left,0px)}
.app{max-width:560px;margin:0 auto;padding:0 14px}
h1{font:400 clamp(30px,10vw,46px)/1.15 Pacifico,"Segoe Script","Brush Script MT",cursive;margin:0;padding:12px 0 8px;text-align:center;white-space:nowrap}
h1 .l{display:inline-block;transform-origin:50% 80%;animation:bob 1.8s ease-in-out infinite,col 6s linear infinite;animation-delay:calc(var(--i)*-.13s),calc(var(--i)*-.4s);text-shadow:0 0 14px currentColor}
h1 .sp{width:.3em}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg) scale(1)}25%{transform:translateY(-.16em) rotate(0) scale(1.12)}50%{transform:translateY(0) rotate(4deg) scale(1)}75%{transform:translateY(.06em) rotate(0) scale(.94)}}
@keyframes col{0%,100%{color:#ff5a5f}20%{color:#ffc233}40%{color:#3ddc97}60%{color:#38bdf8}80%{color:#c77dff}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:none;color:var(--muted);font:600 14px inherit;font-family:inherit;padding:10px 0;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button i{display:inline-block;border:2px solid currentColor;border-radius:3px}
.seg button[data-r="16:9"] i{width:20px;height:12px}.seg button[data-r="9:16"] i{width:12px;height:20px}
.seg button.on{background:var(--accent);color:var(--accent-t)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-bottom:10px}
.stage{background:#000;border-radius:14px;display:flex;justify-content:center;overflow:hidden}
canvas#pv{display:block;max-width:100%;max-height:36vh}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:var(--muted);font:600 13px inherit;font-family:inherit;padding:9px 0;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-t)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:4px}
.sec{display:none;gap:14px}.sec.on{display:grid}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600}
select,input[type=text]{width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
input[type=range]{width:100%;height:28px}
input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pal button{height:34px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0}.pal button.on{border-color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip input{display:none}.chip[hidden]{display:none}
.chip span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;cursor:pointer;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.btn{padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}
.btn.s{padding:9px 10px;font-size:13px}.btn.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}.btn:disabled{opacity:.5}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--accent)}
#st{font-size:13px;color:var(--muted)}#st:empty{display:none}
@media(min-width:900px){.app{max-width:1000px;display:grid;grid-template-columns:minmax(0,1fr) 400px;column-gap:20px;align-items:start}
 h1{grid-column:1/-1}.top{top:0}canvas#pv{max-height:62vh}}
</style>
</head>
<body>
<div class="app">
<h1 id="logo" aria-label="Motion Lifetime">Motion Lifetime</h1>
<div class="top">
<div class="seg" id="seg"><button data-r="16:9"><i></i>Landscape 16:9</button><button data-r="9:16" class="on"><i></i>Portrait 9:16</button></div>
<div class="stage"><canvas id="pv" width="960" height="540"></canvas></div>
<div class="tabs" id="tabs"><button class="on" data-t="t1">Tema</button><button data-t="t2">Latar</button><button data-t="t3">Gerak</button><button data-t="t4">Teks</button><button data-t="t5">Ekspor</button></div>
</div>
<div class="panel">
<section class="sec on" id="t1">
<div><label>PRESET</label><select id="pre"></select></div>
<div><label>KATEGORI</label><select id="cat"></select></div>
<div class="chips" id="chips"></div>
<div class="r2"><button class="btn s" id="all">Pilih semua</button><button class="btn s" id="none">Kosongkan</button></div>
</section>
<section class="sec" id="t2">
<div><label>GAYA LATAR</label><select id="bg">
<option value="gradasi">Gradasi Bergerak</option><option value="waves">Gelombang</option><option value="papan">Papan Tulis</option><option value="buku">Buku Tulis</option><option value="grid">Kertas Grafik (Kotak)</option><option value="bokeh">Bokeh</option><option value="langit">Langit & Awan</option><option value="malam">Malam Berbintang</option><option value="laut">Laut</option><option value="kota">Kota (Skyline)</option><option value="aurora">Aurora</option><option value="hexagon">Hexagon</option><option value="sunburst">Sunburst</option><option value="garis">Garis Neon</option><option value="blobs">Blob Cair</option><option value="rings">Lingkaran Berdenyut</option><option value="dots">Titik Bergelombang</option><option value="solid">Warna Polos</option></select></div>
<div><label>PALET WARNA</label><div class="pal" id="pal"></div></div>
</section>
<section class="sec" id="t3">
<div class="r2"><div><label>POLA GERAK</label><select id="mode">
<option value="float">Melayang</option><option value="fall">Jatuh</option><option value="rise">Naik</option><option value="orbit">Mengorbit</option><option value="bounce">Memantul</option><option value="pulse">Berdenyut</option><option value="marquee">Geser</option><option value="wave">Gelombang</option><option value="spiral">Spiral</option></select></div>
<div><label>ROTASI</label><select id="rot"><option value="none">Tanpa</option><option value="sway">Goyang</option><option value="spin">Berputar</option></select></div></div>
<div><label>JUMLAH OBJEK</label><input type="range" id="cnt" min="3" max="60" value="18"></div>
<div><label>UKURAN OBJEK</label><input type="range" id="siz" min="5" max="30" value="12"></div>
<div><label>KECEPATAN</label><input type="range" id="spd" min="1" max="4" step="1" value="1"></div>
<div class="r2"><div><label>VARIASI</label><input type="range" id="seed" min="1" max="99" value="7"></div><button class="btn s" id="dice" style="align-self:end">🎲 Acak</button></div>
</section>
<section class="sec" id="t4">
<div><label>JUDUL</label><input type="text" id="ttl"></div>
<div><label>SUBJUDUL</label><input type="text" id="sub"></div>
<div class="r2"><div><label>FONT</label><select id="fnt"><option value="sans">Sans Tebal</option><option value="serif">Serif</option><option value="hand">Tulisan Tangan</option><option value="round">Bulat</option></select></div>
<div><label>ANIMASI</label><select id="tan"><option value="none">Diam</option><option value="breathe">Berdenyut</option><option value="float">Melayang</option><option value="wiggle">Goyang</option><option value="wave">Gelombang huruf</option></select></div></div>
<div class="r2"><div><label>POSISI</label><select id="tps"><option value="top">Atas</option><option value="mid">Tengah</option><option value="bot">Bawah</option></select></div>
<div><label>LATAR TEKS</label><select id="tpn"><option value="none">Tanpa</option><option value="white">Kartu putih</option><option value="dark">Kartu gelap</option></select></div></div>
<div class="r2"><div><label>UKURAN</label><input type="range" id="tsz" min="4" max="20" value="11"></div><div><label>WARNA</label><input type="color" id="tcl" value="#ffffff"></div></div>
</section>
<section class="sec" id="t5">
<div class="r2" style="grid-template-columns:1fr"><input type="hidden" id="rat" value="9:16">
<div><label>KUALITAS</label><select id="qlt"><option value="1280">HD 720p</option><option value="1920" selected>Full HD 1080p</option><option value="3840">4K UHD</option></select></div></div>
<div class="r2"><div><label>DURASI</label><select id="dur"><option value="5">5 detik</option><option value="8" selected>8 detik</option><option value="10">10 detik</option><option value="15">15 detik</option><option value="20">20 detik</option></select></div>
<div><label>FPS</label><select id="fps"><option>24</option><option selected>30</option><option>60</option></select></div></div>
<button class="btn p" id="vid">Ekspor Video</button><button class="btn" id="png">Simpan Frame PNG</button><button class="btn s" id="cancel" style="display:none">Batalkan ekspor</button>
<div class="bar" id="bar"><i></i></div><div id="st"></div>
</section>
</div>
</div>
<script>
const TAU=Math.PI*2,$=id=>document.getElementById(id);
const PALS=[["#14246b","#2f5fd0","#ffc233","#ff5a5f","#3ddc97"],["#fdf2f8","#dbeafe","#fb7185","#60a5fa","#fbbf24"],
["#0b1030","#3a1c71","#d76d77","#ffaf7b","#ffe29f"],["#021b2b","#0a4d68","#088395","#05bfdb","#9ef0ff"],["#12071f","#5b2a86","#7209b7","#f72585","#ff9ec7"],
["#08130d","#0f5132","#1b9c5e","#7bd389","#e3f9c6"],["#fff7ec","#ffd6a5","#ff9f68","#ff5e5b","#7a2e8e"],["#0f0f14","#2b2d42","#8d99ae","#edf2f4","#ef233c"],
["#10002b","#240046","#5a189a","#9d4edd","#e0aaff"],["#1a1423","#372549","#774c60","#b75d69","#eacdc2"]];
let pal=0,curT=0;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rgba(h,a){const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const D="#1b1d2a",W="#fff";
const R=(c,f,x,y,w,h,r=0)=>{c.fillStyle=f;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()};
const Ci=(c,f,x,y,r)=>{c.fillStyle=f;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()};
const Pg=(c,f,p)=>{c.fillStyle=f;c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fill()};
const Ln=(c,s,w,a,b)=>{c.strokeStyle=s;c.lineWidth=w;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()};
const Tx=(c,s,f,z)=>{c.save();c.scale(.01,.01);c.fillStyle=f;c.font=`800 ${z*100}px system-ui,sans-serif`;c.textAlign="center";c.textBaseline="middle";c.fillText(s,0,z*5);c.restore()};

// ===== Pustaka objek vektor sekolah (koordinat -1..1) =====
const IC={
buku:["📚","Buku",(c,P)=>{R(c,P[2],-.7,-.9,1.4,1.8,.1);R(c,"rgba(0,0,0,.2)",-.7,-.9,.25,1.8,.1);R(c,W,-.45,.62,1.15,.2,.05);R(c,P[4],-.2,-.6,.7,.7,.08);R(c,W,-.05,-.4,.4,.1);R(c,W,-.05,-.2,.4,.1)}],
pensil:["✏️","Pensil",(c,P)=>{c.rotate(.785);R(c,P[3],-.2,-.9,.4,1.4);R(c,"#f7a1b5",-.2,-1.15,.4,.27,.07);R(c,"#c9ced8",-.2,-.9,.4,.14);Pg(c,"#f4d6aa",[[-.2,.5],[.2,.5],[0,1.05]]);Pg(c,D,[[-.07,.86],[.07,.86],[0,1.05]]);R(c,"rgba(255,255,255,.25)",-.1,-.75,.08,1.2)}],
penggaris:["📏","Penggaris",(c,P)=>{R(c,P[4],-1,-.3,2,.6,.08);for(let i=0;i<11;i++)R(c,"rgba(0,0,0,.5)",-.85+i*.17,-.3,.035,i%2?.18:.3)}],
topi:["🎓","Topi Wisuda",(c,P)=>{Pg(c,"#2f3556",[[-.55,0],[-.55,.45],[0,.72],[.55,.45],[.55,0],[0,.25]]);Pg(c,D,[[0,-.65],[1,-.2],[0,.25],[-1,-.2]]);Ln(c,P[3],.06,[.82,-.16],[.82,.45]);Ci(c,P[3],.82,.5,.1)}],
gedung:["🏫","Gedung Sekolah",(c,P)=>{R(c,"rgba(0,0,0,.15)",-1,.7,2,.1,.04);R(c,P[2],-.8,-.2,1.6,.9);Pg(c,P[3],[[-.95,-.2],[0,-.8],[.95,-.2]]);R(c,P[4],-.15,.2,.3,.5,.05);R(c,W,-.6,0,.28,.28,.03);R(c,W,.32,0,.28,.28,.03);Ln(c,D,.04,[0,-.8],[0,-1.05]);Pg(c,P[4],[[0,-1.05],[.32,-.97],[0,-.89]])}],
globe:["🌍","Globe",(c,P)=>{Ci(c,P[3],0,-.05,.72);Pg(c,P[2],[[-.4,-.45],[-.1,-.6],[.05,-.35],[-.2,-.15],[-.45,-.2]]);Pg(c,P[2],[[.15,.05],[.5,-.05],[.55,.25],[.3,.5],[.1,.35]]);c.strokeStyle="rgba(255,255,255,.55)";c.lineWidth=.04;c.beginPath();c.ellipse(0,-.05,.3,.72,0,0,TAU);c.moveTo(-.72,-.05);c.lineTo(.72,-.05);c.stroke();c.strokeStyle=D;c.lineWidth=.07;c.beginPath();c.arc(0,-.05,.9,.15,2.6);c.stroke();R(c,D,-.4,.85,.8,.13,.05)}],
atom:["⚛️","Atom",(c,P)=>{c.lineWidth=.08;c.strokeStyle=P[3];[0,1.047,2.094].forEach(a=>{c.beginPath();c.ellipse(0,0,.95,.36,a,0,TAU);c.stroke()});Ci(c,P[2],0,0,.2);Ci(c,P[4],.9,0,.09);Ci(c,P[4],-.45,.78,.09);Ci(c,P[4],-.45,-.78,.09)}],
bel:["🔔","Lonceng",(c,P)=>{c.fillStyle=P[4];c.beginPath();c.moveTo(-.85,.5);c.quadraticCurveTo(-.6,.4,-.55,-.1);c.bezierCurveTo(-.5,-.75,.5,-.75,.55,-.1);c.quadraticCurveTo(.6,.4,.85,.5);c.closePath();c.fill();Ci(c,P[3],0,.68,.17);Ci(c,P[4],0,-.72,.1)}],
jam:["🕒","Jam",(c,P)=>{Ci(c,P[3],0,0,.92);Ci(c,W,0,0,.74);for(let i=0;i<12;i++){const a=i*TAU/12;Ln(c,D,.05,[.6*Math.sin(a),-.6*Math.cos(a)],[.68*Math.sin(a),-.68*Math.cos(a)])}const h=TAU*curT,m=TAU*curT*4;Ln(c,D,.08,[0,0],[.4*Math.sin(h),-.4*Math.cos(h)]);Ln(c,P[2],.06,[0,0],[.58*Math.sin(m),-.58*Math.cos(m)]);Ci(c,D,0,0,.07)}],
tas:["🎒","Tas",(c,P)=>{c.strokeStyle=P[3];c.lineWidth=.14;c.beginPath();c.arc(0,-.6,.38,Math.PI,0);c.stroke();R(c,P[2],-.7,-.6,1.4,1.5,.3);R(c,P[3],-.7,-.6,1.4,.6,.3);R(c,P[4],-.42,.2,.84,.5,.14);R(c,W,-.07,-.12,.14,.2,.04)}],
apel:["🍎","Apel",(c,P)=>{Ci(c,P[2],-.3,.1,.62);Ci(c,P[2],.3,.1,.62);Ln(c,D,.09,[0,-.35],[.12,-.8]);c.fillStyle=P[4];c.beginPath();c.ellipse(.4,-.62,.3,.13,-.45,0,TAU);c.fill();Ci(c,"rgba(255,255,255,.3)",-.5,-.05,.12)}],
bintang:["⭐","Bintang",(c,P)=>{Pg(c,P[4],[...Array(10)].map((_,i)=>{const r=i%2?.42:1,a=-Math.PI/2+i*Math.PI/5;return[r*Math.cos(a),r*Math.sin(a)]}))}],
bulb:["💡","Lampu Ide",(c,P)=>{for(let i=0;i<5;i++){const a=-2.6+i*.55;Ln(c,P[4],.07,[1*Math.cos(a),-.2+Math.sin(a)],[.82*Math.cos(a),-.2+.82*Math.sin(a)])}Ci(c,P[4],0,-.2,.58);R(c,"#c9ced8",-.25,.3,.5,.28,.06);R(c,"#9aa1b3",-.18,.6,.36,.12,.05);Ln(c,"rgba(255,255,255,.7)",.05,[-.15,-.1],[0,.25])}],
calc:["🧮","Kalkulator",(c,P)=>{R(c,D,-.6,-.9,1.2,1.8,.15);R(c,"#cfe9d6",-.45,-.75,.9,.4,.06);for(let r=0;r<4;r++)for(let q=0;q<3;q++)R(c,q==2&&r==3?P[2]:r==0?P[3]:"#8890a6",-.45+q*.32,-.2+r*.28,.26,.2,.05)}],
aplus:["🅰️","Nilai A+",(c,P)=>{Ci(c,P[2],0,0,.92);Tx(c,"A+",W,.7)}],
pi:["🔢","Rumus π",(c,P)=>{Ci(c,P[3],0,0,.92);Tx(c,"π",W,1.1)}]
};

// ===== Pustaka tema (DSL vektor) =====
let OC="#fff";
const pr=a=>{const r=[];for(let i=0;i<a.length;i+=2)r.push([a[i],a[i+1]]);return r};
function dsl(c,P,ops){const m={a:P[2],b:P[3],c:P[4],d:D,w:W,x:OC},f=v=>m[v]||v;
 for(const o of ops){const t=o[0];
  if(t=="c")Ci(c,f(o[1]),o[2],o[3],o[4]);
  else if(t=="r")R(c,f(o[1]),o[2],o[3],o[4],o[5],o[6]||0);
  else if(t=="p")Pg(c,f(o[1]),pr(o[2]));
  else if(t=="l")Ln(c,f(o[1]),o[2],[o[3],o[4]],[o[5],o[6]]);
  else if(t=="e"){c.fillStyle=f(o[1]);c.beginPath();c.ellipse(o[2],o[3],o[4],o[5],o[6]||0,0,TAU);c.fill()}
  else if(t=="o"){c.fillStyle=f(o[1]);c.beginPath();c.arc(o[2],o[3],o[4],0,TAU);c.arc(o[2],o[3],o[5],0,TAU,true);c.fill("evenodd")}
  else if(t=="d"){c.fillStyle=f(o[1]);c.beginPath();c.arc(o[2],o[3],o[4],0,Math.PI);c.fill()}
  else if(t=="a"){c.strokeStyle=f(o[1]);c.lineWidth=o[2];c.beginPath();c.arc(o[3],o[4],o[5],o[6],o[7]);c.stroke()}
  else if(t=="s"){const p=pr(o[2]),n=p.length,md=(u,q)=>[(u[0]+q[0])/2,(u[1]+q[1])/2];c.fillStyle=f(o[1]);c.beginPath();const s=md(p[n-1],p[0]);c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const q=p[i],e=md(q,p[(i+1)%n]);c.quadraticCurveTo(q[0],q[1],e[0],e[1])}c.closePath();c.fill()}
  else if(t=="g"){c.fillStyle=f(o[1]);for(let j=0;j<o[9];j++)for(let i=0;i<o[8];i++)c.fillRect(o[2]+i*o[6],o[3]+j*o[7],o[4],o[5])}
  else if(t=="v"){for(let i=0;i<o[3];i++){const q=i*TAU/o[3];Ln(c,f(o[1]),o[2],[o[4]*Math.cos(q),o[4]*Math.sin(q)],[o[5]*Math.cos(q),o[5]*Math.sin(q)])}}
  else if(t=="t"){c.save();c.translate(o[4]||0,o[5]||0);Tx(c,o[1],f(o[2]),o[3]);c.restore()}
  else if(t=="x")c.rotate(o[1]);
  else if(t=="xt")c.rotate(TAU*curT*o[1]);
  else if(t=="u"){c.save();c.beginPath();c.arc(o[2],o[3],o[4],0,TAU);c.clip();c.fillStyle=f(o[1]);c.beginPath();c.rect(-3,-3,6,6);c.arc(o[5],o[6],o[7],0,TAU);c.fill("evenodd");c.restore()}

});
// ===== Objek bergerak =====
function objs(c,w,h,t,P,r,o){
 const L=o.list,n=o.cnt;if(!L.length)return;const m=Math.min(w,h),sp=o.spd;
 const cols=Math.max(1,Math.ceil(Math.sqrt(n*w/h))),rows=Math.ceil(n/cols);
 const perm=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
 for(let i=0;i<n;i++){
  const k=perm[i],a=r(),b=r(),d=r(),e=r(),f=r(),dir=e<.5?-1:1,sc=m*o.siz/200*(.6+.7*b),ph=a*TAU;
  const gx=((k%cols)+.5+(d-.5)*.6)/cols*w,gy=(Math.floor(k/cols)+.5+(f-.5)*.6)/rows*h,sx=(k+.5+(d-.5)*.7)/n*w;
  let x=gx,y=gy,s=1;
  switch(o.mode){
  case"float":x+=m*.03*Math.sin(TAU*t*sp+ph);y+=m*.04*Math.cos(TAU*t*sp+ph*1.3);break;
  case"fall":case"rise":{const v=o.mode=="fall"?1:-1,u=(((f+t*sp*v)%1)+1)%1;x=sx+m*.03*Math.sin(TAU*t*sp+ph);y=u*(h+4*sc)-2*sc;break}
  case"orbit":{const ring=k%3,rx=w*(.14+.12*ring),ry=h*(.14+.12*ring),an=TAU*(Math.floor(k/3)/Math.ceil(n/3))+ph*.15+TAU*t*sp*(ring%2?-1:1);x=w/2+rx*Math.cos(an);y=h/2+ry*Math.sin(an);break}
  case"bounce":y+=m*.06-m*.14*Math.abs(Math.sin(Math.PI*(t*sp+a)));break;
  case"pulse":s=1+.28*Math.sin(TAU*t*sp+ph);break;
  case"wave":{const u=(((sx/w+t*sp)%1)+1)%1;x=u*(w+4*sc)-2*sc;y=h*(.12+.76*f)+h*.07*Math.sin(TAU*2*u+ph);break}
  case"spiral":{const u=(((k/n+t*sp)%1)+1)%1,an=TAU*k*.618+u*TAU*1.2,rr=u*Math.hypot(w,h)*.5;x=w/2+rr*Math.cos(an);y=h/2+rr*Math.sin(an);s=.25+.9*u;break}
  case"marquee":{const rw=Math.max(2,Math.round(Math.sqrt(n/2))),row=k%rw,u=(((f*3+d+t*sp*(row%2?-1:1))%1)+1)%1;x=u*(w+4*sc)-2*sc;y=(row+.5)/rw*h;break}
  }
  const rt=o.rot=="none"?(a-.5)*.5:o.rot=="sway"?.35*Math.sin(TAU*t*sp+ph):a*TAU+TAU*t*sp*dir;
  OC=P[2+i%3];c.save();c.translate(x,y);c.rotate(rt);c.scale(sc*s,sc*s);c.lineCap="round";c.lineJoin="round";IC[L[i%L.length]][2](c,P);c.restore()}
}

const FONTS={sans:'800 {s}px Inter,"Segoe UI",system-ui,sans-serif',serif:'800 {s}px Georgia,"Times New Roman",serif',hand:'700 {s}px "Segoe Print","Bradley Hand","Comic Sans MS","Marker Felt",cursive',round:'800 {s}px "Trebuchet MS",Verdana,sans-serif'};
function fit(c,txt,fs,fam,mx){c.font=FONTS[fam].replace("{s}",fs);let wd=c.measureText(txt).width;if(wd>mx){fs*=mx/wd;wd=mx;c.font=FONTS[fam].replace("{s}",fs)}return[fs,wd]}
function line(c,txt,y,fs,fam,col,wave,t){c.font=FONTS[fam].replace("{s}",fs);c.fillStyle=col;c.textBaseline="middle";
 if(!wave){c.textAlign="center";c.fillText(txt,0,y)}else{c.textAlign="left";let x=-c.measureText(txt).width/2;[...txt].forEach((ch,i)=>{c.fillText(ch,x,y+fs*.12*Math.sin(TAU*(t-i/txt.length)));x+=c.measureText(ch).width})}}
function text(c,w,h,t){
 const a=$("ttl").value.trim(),b=$("sub").value.trim();if(!a&&!b)return;
 const m=Math.min(w,h),fam=$("fnt").value,an=$("tan").value,col=$("tcl").value,pn=$("tpn").value,mx=w*.84,base=m*$("tsz").value/100;
 const[fs,tw]=a?fit(c,a,base,fam,mx):[base,0],[sf,sw]=b?fit(c,b,a?fs*.4:base*.7,fam,mx):[fs*.4,0];
 const cy=h*({top:.2,mid:.5,bot:.8}[$("tps").value]),y1=b?-fs*.28:0,y2=a?fs*.62:0;
 c.save();c.translate(w/2,cy);
 if(an=="breathe"){const s=1+.04*Math.sin(TAU*t);c.scale(s,s)}
 if(an=="wiggle")c.rotate(.035*Math.sin(TAU*t));
 if(an=="float")c.translate(0,m*.02*Math.sin(TAU*t));
 if(pn!="none"){const top=(a?y1-fs*.7:y2-sf)-fs*.15,bot=(b?y2+sf*.95:y1+fs*.7)+fs*.15,pw=Math.max(tw,sw)+fs*.9;R(c,pn=="white"?"rgba(255,255,255,.93)":"rgba(15,18,28,.8)",-pw/2,top,pw,bot-top,fs*.3)}
 else{c.shadowColor="rgba(0,0,0,.35)";c.shadowBlur=fs*.15;c.shadowOffsetY=fs*.05}
 if(a)line(c,a,y1,fs,fam,col,an=="wave",t);
 if(b){c.shadowColor="transparent";if(pn=="none"){c.shadowColor="rgba(0,0,0,.35)"}line(c,b,y2,sf,fam,col,an=="wave",t)}
 c.restore();
}

async function exportMP4(){
 const[W,H]=dims(+$("qlt").value),fps=+$("fps").value,total=Math.round(+$("dur").value*fps),px=W*H,br=px>=8e6?35e6:px>=2e6?15e6:8e6;
 const codecs=px>2.2e6?(fps>30?["avc1.640034","avc1.640033"]:["avc1.640033","avc1.640034"]):["avc1.64002A","avc1.640028","avc1.4d0028"];
 let cfg=null;for(const codec of codecs){const x={codec,width:W,height:H,bitrate:br,framerate:fps};try{const s=await VideoEncoder.isConfigSupported(x);if(s.supported){cfg=x;break}}catch(e){}}
 if(!cfg)return false;
 const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d"),bar=$("bar"),fill=bar.firstElementChild;
 const ui=on=>{bar.style.display=on?"block":"none";$("cancel").style.display=on?"block":"none";$("vid").disabled=$("png").disabled=on};
 ui(true);cancelled=false;
 try{
  const target=new Mp4Muxer.ArrayBufferTarget(),muxer=new Mp4Muxer.Muxer({target,video:{codec:"avc",width:W,height:H},fastStart:"in-memory"});
  let err=null;const enc=new VideoEncoder({output:(k,m)=>muxer.addVideoChunk(k,m),error:e=>err=e});enc.configure(cfg);
  for(let i=0;i<total;i++){
   if(cancelled){enc.close();$("st").textContent="Dibatalkan.";ui(false);return true}
   if(err)throw err;
   render(c,W,H,i/total);
   const f=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
   enc.encode(f,{keyFrame:i%(fps*2)==0});f.close();
   while(enc.encodeQueueSize>6)await new Promise(r=>setTimeout(r,4));
   if(i%3==0){fill.style.width=(i/total*100)+"%";$("st").textContent=`Encode MP4 ${W}×${H}: frame ${i+1}/${total}`;await new Promise(r=>setTimeout(r,0))}
  }
  await enc.flush();if(err)throw err;muxer.finalize();
  dl(new Blob([target.buffer],{type:"video/mp4"}),`motion-lifetime-${W}x${H}.mp4`);$("st").textContent="Selesai! File MP4 diunduh.";
 }catch(e){$("st").textContent="Gagal ekspor MP4: "+e.message}
 ui(false);return true}
$("vid").onclick=async()=>{
 const want=true,can=window.VideoEncoder&&window.VideoFrame&&window.Mp4Muxer;
 if(want&&can){if(await exportMP4())return;$("st").textContent="Encoder H.264 tidak tersedia, beralih ke WebM…"}
 else if(want)$("st").textContent="MP4 tidak didukung browser ini, beralih ke WebM…";

function exportWebM(){
 if(!window.MediaRecorder){$("st").textContent="Browser tidak mendukung MediaRecorder. Gunakan Chrome/Edge.";return}
 const[W,H]=dims(+$("qlt").value),fps=+$("fps").value,dur=+$("dur").value*1000,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
 const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m)),px=W*H,bps=px>=8e6?45e6:px>=2e6?18e6:8e6;
 let rec;try{rec=new MediaRecorder(cv.captureStream(fps),{mimeType:mime,videoBitsPerSecond:bps})}catch(e){$("st").textContent="Gagal memulai perekam: "+e.message;return}
 const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 const bar=$("bar"),fill=bar.firstElementChild;bar.style.display="block";$("vid").disabled=$("png").disabled=true;$("st").textContent=`Merender ${W}×${H}…`;
 rec.onstop=()=>{dl(new Blob(chunks,{type:"video/webm"}),`motion-lifetime-${W}x${H}.webm`);bar.style.display="none";$("vid").disabled=$("png").disabled=false;$("st").textContent="Selesai! File diunduh."};
 rec.start();const s=performance.now();
 (function f(now){const e=now-s;if(e>=dur){render(c,W,H,0);setTimeout(()=>rec.stop(),150);return}render(c,W,H,e/dur);fill.style.width=(e/dur*100)+"%";requestAnimationFrame(f)})(s);
};
